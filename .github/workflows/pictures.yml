name: Picture candidates

# Free: makes a few picture options per scene for Claude to look at and pick from.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job file, e.g. jobs/curious/sample-escalator.json"
        required: true
      scenes:
        description: "Only these scene numbers, space separated (optional)"
        required: false
      models:
        description: "Picture models, comma separated. gemini:<model> is PAID (~Rs 3 each, 1 per scene)"
        required: false
        default: "zimage,klein,microsoft/mai-image-2.6-flash"
      max_paid:
        description: "Hard cap on paid pictures this run"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  pictures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PICTURE_MODELS: ${{ github.event.inputs.models }}
      MAX_PAID_CALLS: ${{ github.event.inputs.max_paid }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow numpy
      - run: python -m factory.pictures "${{ github.event.inputs.job }}" ${{ github.event.inputs.scenes }}
      - name: Upload as a release
        run: |
          id=$(python -c "import json;print(json.load(open('${{ github.event.inputs.job }}'))['id'])")
          ls out/pics/$id/*.json 2>/dev/null && echo "raw replies kept for checking" || true
          cd out/pics/$id && zip -q -r ../../../pics.zip . && cd -
          gh release delete "pics-$id" -y --cleanup-tag 2>/dev/null || true
          gh release create "pics-$id" pics.zip out/pics/$id/sheet_*.jpg --title "Pictures: $id" --notes "Candidates" --prerelease
