name: Publish

# 19:00 IST and 06:30 IST. Each video carries its own slot, so only what's due goes out.
on:
  schedule:
    - cron: "30 13 * * *"   # 19:00 IST
    - cron: "0 1 * * *"     # 06:30 IST (US evening test slot)
  workflow_dispatch:
    inputs:
      force_id:
        description: "Post this job id right now (optional)"
        required: false

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      CURIOUS_YT_REFRESH_TOKEN: ${{ secrets.CURIOUS_YT_REFRESH_TOKEN }}
      CURIOUS_META_PAGE_TOKEN: ${{ secrets.CURIOUS_META_PAGE_TOKEN }}
      CURIOUS_IG_USER_ID: ${{ secrets.CURIOUS_IG_USER_ID }}
      CURIOUS_FB_PAGE_ID: ${{ secrets.CURIOUS_FB_PAGE_ID }}
      DRAMA_YT_REFRESH_TOKEN: ${{ secrets.DRAMA_YT_REFRESH_TOKEN }}
      DRAMA_META_PAGE_TOKEN: ${{ secrets.DRAMA_META_PAGE_TOKEN }}
      DRAMA_IG_USER_ID: ${{ secrets.DRAMA_IG_USER_ID }}
      DRAMA_FB_PAGE_ID: ${{ secrets.DRAMA_FB_PAGE_ID }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v24.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Post
        run: |
          if [ -n "${{ github.event.inputs.force_id }}" ]; then
            python -m factory.publish --force "${{ github.event.inputs.force_id }}"
          else
            python -m factory.publish
          fi
      - name: Save state
        if: always()
        run: |
          git config user.name "video-factory"
          git config user.email "actions@github.com"
          git add state
          git diff --cached --quiet || (git commit -m "Published" && git pull --rebase && git push)
