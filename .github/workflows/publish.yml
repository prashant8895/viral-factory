name: Publish

# Backup for the Publish timer: 23:30 IST slot (since 2026-11-23) and 06:30 IST.
# Each video carries its own slot, so only what's due goes out.
on:
  schedule:
    # Night slot 23:30 IST (18:00 UTC), then retries at 00:00, 00:30 and 01:30 IST (the last one).
    - cron: "0 18 * * *"
    - cron: "30 18 * * *"
    - cron: "0 19 * * *"
    - cron: "0 20 * * *"
    # Morning slot 06:30 IST (US evening test), retries 07:00 and 07:30.
    - cron: "0 1 * * *"
    - cron: "30 1 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force_id:
        description: "Post this job id right now (optional)"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      CURIOUS_EN_YT_REFRESH_TOKEN: ${{ secrets.CURIOUS_EN_YT_REFRESH_TOKEN }}
      CURIOUS_EN_META_PAGE_TOKEN: ${{ secrets.CURIOUS_EN_META_PAGE_TOKEN }}
      CURIOUS_EN_IG_USER_ID: ${{ secrets.CURIOUS_EN_IG_USER_ID }}
      CURIOUS_EN_FB_PAGE_ID: ${{ secrets.CURIOUS_EN_FB_PAGE_ID }}
      CURIOUS_HI_YT_REFRESH_TOKEN: ${{ secrets.CURIOUS_HI_YT_REFRESH_TOKEN }}
      CURIOUS_HI_META_PAGE_TOKEN: ${{ secrets.CURIOUS_HI_META_PAGE_TOKEN }}
      CURIOUS_HI_IG_USER_ID: ${{ secrets.CURIOUS_HI_IG_USER_ID }}
      CURIOUS_HI_FB_PAGE_ID: ${{ secrets.CURIOUS_HI_FB_PAGE_ID }}
      DRAMA_YT_REFRESH_TOKEN: ${{ secrets.DRAMA_YT_REFRESH_TOKEN }}
      DRAMA_META_PAGE_TOKEN: ${{ secrets.DRAMA_META_PAGE_TOKEN }}
      DRAMA_IG_USER_ID: ${{ secrets.DRAMA_IG_USER_ID }}
      DRAMA_FB_PAGE_ID: ${{ secrets.DRAMA_FB_PAGE_ID }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v24.0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Post (retries only the platforms still missing; never double-posts)
        env:
          FINAL_TRY: ${{ github.event.schedule == '0 20 * * *' || github.event.schedule == '0 2 * * *' }}
        run: |
          if [ -n "${{ github.event.inputs.force_id }}" ]; then
            python -m factory.publish --force "${{ github.event.inputs.force_id }}"
          else
            python -m factory.publish
          fi
      - name: Save state
        if: always()
        run: |
          git config user.name "video-factory"
          git config user.email "actions@github.com"
          git add state
          git diff --cached --quiet || (git commit -m "Published" && git pull --rebase && git push)
