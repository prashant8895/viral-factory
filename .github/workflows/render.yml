name: Render video

# Runs when Claude pushes a new job file. Makes the video and stores it as a
# GitHub release, ready for the publisher.
on:
  push:
    paths: ["jobs/**/*.json"]
  workflow_dispatch:
    inputs:
      job:
        description: "Job file to (re)render, e.g. jobs/curious/example-sleep.json"
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER || 'pollinations' }}
      POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      VIDEO_MODEL: ${{ vars.VIDEO_MODEL }}
      IMAGE_EDIT_MODEL: ${{ vars.IMAGE_EDIT_MODEL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find job files to render
        id: find
        run: |
          if [ -n "${{ github.event.inputs.job }}" ]; then
            echo "files=${{ github.event.inputs.job }}" >> "$GITHUB_OUTPUT"
          else
            echo "files=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'jobs/**/*.json' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Download voice model
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f models/kokoro-v1.0.onnx ] || curl -sSL -o models/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -sSL -o models/voices-v1.0.bin $base/voices-v1.0.bin

      - run: pip install -r requirements.txt

      - name: Render (3 tries per video, nothing half-done is released)
        id: render
        run: |
          failed=""
          for f in ${{ steps.find.outputs.files }}; do
            id=$(python -c "import json,sys;print(json.load(open('$f'))['id'])")
            ok=""
            for try in 1 2 3; do
              if python -m factory.render "$f" 2>&1 | tee "render-$id.log"; [ "${PIPESTATUS[0]}" -eq 0 ]; then
                ok=1; break
              fi
              err=$(grep -E "StepFailed|Error|error" "render-$id.log" | tail -3 || true)
              [ "$try" -eq 1 ] && { python -m factory.notify fail "Render failed: $id" "Try 1 failed: $err" || true; } || true
              [ "$try" -lt 3 ] && echo "Waiting 10 minutes before try $((try+1))" && sleep 600
            done
            if [ -z "$ok" ]; then
              python -m factory.notify still "Render failed: $id" "$err" || true
              failed="$failed $id"
              continue
            fi
            python -m factory.notify fixed "Render failed: $id" "Video $id is made." || true
            gh release delete "job-$id" -y --cleanup-tag 2>/dev/null || true
            gh release create "job-$id" out/$id/final.mp4 out/$id/thumb.jpg out/$id/meta.json \
              --title "$id" --notes "Rendered from $f" --prerelease
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Save state
        if: always()
        run: |
          git config user.name "video-factory"
          git config user.email "actions@github.com"
          git add state channels/*/cast
          git diff --cached --quiet || (git commit -m "Rendered: ${{ steps.find.outputs.files }}" && git pull --rebase && git push)

      - name: Mark the run red if any video failed
        if: steps.render.outputs.failed != ''
        run: echo "Failed:${{ steps.render.outputs.failed }}" && exit 1
