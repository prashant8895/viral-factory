name: Render video

# Runs when Claude pushes a new job file. Makes the video and stores it as a
# GitHub release, ready for the publisher.
on:
  push:
    paths: ["jobs/**/*.json"]
  workflow_dispatch:
    inputs:
      job:
        description: "Job file to (re)render, e.g. jobs/curious/example-sleep.json"
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to 26.04 on 2026-11-10 and its ffmpeg dropped seconds of voice
    timeout-minutes: 240
    env:
      MAX_PAID_CALLS: ${{ vars.MAX_PAID_CALLS || '40' }}
      IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER || 'pollinations' }}
      POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      VIDEO_MODEL: ${{ vars.VIDEO_MODEL }}
      VIDEO_PROVIDER: ${{ vars.VIDEO_PROVIDER }}
      VIDEO_RESOLUTION: ${{ vars.VIDEO_RESOLUTION || '720p' }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      IMAGE_EDIT_MODEL: ${{ vars.IMAGE_EDIT_MODEL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Find job files to render
        id: find
        run: |
          if [ -n "${{ github.event.inputs.job }}" ]; then
            files="${{ github.event.inputs.job }}"   # run by hand: render exactly this one
          else
            # On a push, only render real videos (publish: true). Editing an example or a
            # draft never spends anything.
            files=""
            for f in $(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'jobs/**/*.json'); do
              python -c "import json,sys; sys.exit(0 if json.load(open('$f')).get('publish') else 1)" && files="$files $f"
            done
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          [ -n "$files" ] || echo "Nothing to render."

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        timeout-minutes: 12
        run: |
          # the Ubuntu mirror sometimes stalls: give each try 3 minutes, try 3 times
          for i in 1 2 3; do
            timeout 180 sudo apt-get update -qq -o Acquire::Retries=3 && \
            timeout 180 sudo apt-get install -y -qq -o Acquire::Retries=3 ffmpeg && exit 0
            echo "ffmpeg install try $i stalled, retrying"; sleep 20
          done
          exit 1

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Download voice model
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f models/kokoro-v1.0.onnx ] || curl -sSL -o models/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -sSL -o models/voices-v1.0.bin $base/voices-v1.0.bin

      - run: pip install -r requirements.txt

      - name: Browser for 2D animated scenes (only when a job has one)
        if: steps.find.outputs.files != ''
        timeout-minutes: 15
        run: |
          if grep -l '"anim"' ${{ steps.find.outputs.files }} >/dev/null 2>&1; then
            pip install playwright==1.48.0
            for i in 1 2 3; do
              timeout 300 python -m playwright install --with-deps chromium && exit 0
              echo "browser install try $i stalled, retrying"; sleep 20
            done
            exit 1
          fi

      - name: Reuse paid results from earlier runs (never pay twice for the same thing)
        uses: actions/cache/restore@v4
        with:
          path: paid-cache
          key: paid-cache-${{ github.run_id }}
          restore-keys: paid-cache-

      - name: Render (3 tries per video, nothing half-done is released)
        id: render
        if: steps.find.outputs.files != ''
        run: |
          failed=""
          for f in ${{ steps.find.outputs.files }}; do
            id=$(python -c "import json,sys;print(json.load(open('$f'))['id'])")
            ok=""
            for try in 1 2 3; do
              if python -m factory.render "$f" 2>&1 | tee "render-$id.log"; [ "${PIPESTATUS[0]}" -eq 0 ]; then
                ok=1; break
              fi
              err=$(grep -E "StepFailed|Error|error" "render-$id.log" | tail -3 || true)
              [ "$try" -eq 1 ] && { python -m factory.notify fail "Render failed: $id" "Try 1 failed: $err" || true; } || true
              [ "$try" -lt 3 ] && echo "Waiting 10 minutes before try $((try+1))" && sleep 600
            done
            if [ -z "$ok" ]; then
              python -m factory.notify still "Render failed: $id" "$err" || true
              failed="$failed $id"
              continue
            fi
            python -m factory.notify fixed "Render failed: $id" "Video $id is made." || true
            # one release per finished video (a two-language job makes two)
            for vid in $(cat out/produced.txt); do
              gh release delete "job-$vid" -y --cleanup-tag 2>/dev/null || true
              gh release create "job-$vid" out/$vid/final.mp4 out/$vid/thumb.jpg out/$vid/meta.json \
                --title "$vid" --notes "Rendered from $f" --prerelease
            done
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Keep paid results, even if the run failed
        if: always()
        uses: actions/cache/save@v4
        with:
          path: paid-cache
          key: paid-cache-${{ github.run_id }}

      - name: Save state
        if: always()
        run: |
          git config user.name "video-factory"
          git config user.email "actions@github.com"
          git add state channels/*/cast
          git diff --cached --quiet || (git commit -m "Rendered: ${{ steps.find.outputs.files }}" && git pull --rebase && git push)

      - name: Mark the run red if any video failed
        if: steps.render.outputs.failed != ''
        run: echo "Failed:${{ steps.render.outputs.failed }}" && exit 1
