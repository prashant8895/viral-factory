name: Take down a video

# Run by hand: removes a posted video from YouTube, Instagram (Reel + Story) and Facebook.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "State ids, space separated, e.g. curious-2026-11-10-winter-smog-en curious-2026-11-10-winter-smog-hi"
        required: true

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  takedown:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      CURIOUS_EN_YT_REFRESH_TOKEN: ${{ secrets.CURIOUS_EN_YT_REFRESH_TOKEN }}
      CURIOUS_EN_META_PAGE_TOKEN: ${{ secrets.CURIOUS_EN_META_PAGE_TOKEN }}
      CURIOUS_EN_IG_USER_ID: ${{ secrets.CURIOUS_EN_IG_USER_ID }}
      CURIOUS_EN_FB_PAGE_ID: ${{ secrets.CURIOUS_EN_FB_PAGE_ID }}
      CURIOUS_HI_YT_REFRESH_TOKEN: ${{ secrets.CURIOUS_HI_YT_REFRESH_TOKEN }}
      CURIOUS_HI_META_PAGE_TOKEN: ${{ secrets.CURIOUS_HI_META_PAGE_TOKEN }}
      CURIOUS_HI_IG_USER_ID: ${{ secrets.CURIOUS_HI_IG_USER_ID }}
      CURIOUS_HI_FB_PAGE_ID: ${{ secrets.CURIOUS_HI_FB_PAGE_ID }}
      DRAMA_YT_REFRESH_TOKEN: ${{ secrets.DRAMA_YT_REFRESH_TOKEN }}
      DRAMA_META_PAGE_TOKEN: ${{ secrets.DRAMA_META_PAGE_TOKEN }}
      DRAMA_IG_USER_ID: ${{ secrets.DRAMA_IG_USER_ID }}
      DRAMA_FB_PAGE_ID: ${{ secrets.DRAMA_FB_PAGE_ID }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v24.0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Remove from every platform
        id: rm
        run: python -m factory.takedown ${{ github.event.inputs.ids }}
      - name: Save state
        if: always()
        run: |
          git config user.name "video-factory"
          git config user.email "actions@github.com"
          git add state
          git diff --cached --quiet || (git commit -m "Taken down: ${{ github.event.inputs.ids }}" && git pull --rebase && git push)
