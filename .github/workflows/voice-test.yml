name: Voice test

# One-off: the same lines in Kokoro and Gemini, saved as release "voice-test".
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kokoro-gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - name: Download voice model
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f models/kokoro-v1.0.onnx ] || curl -sSL -o models/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -sSL -o models/voices-v1.0.bin $base/voices-v1.0.bin
      - run: pip install -r requirements.txt
      - run: python -m factory.voice_test kokoro gemini
      - uses: actions/upload-artifact@v4
        with:
          name: voices-a
          path: voice-test/

  release:
    needs: [kokoro-gemini]
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: all/
      - name: Publish
        run: |
          mkdir -p out && cp -n all/*/*.wav all/*/*.txt out/ 2>/dev/null || true
          ls -la out
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          for f in out/*.wav; do case "$f" in *ref_*) continue;; esac; ffmpeg -v error -y -i "$f" -b:a 128k "${f%.wav}.mp3"; done
          gh release delete voice-test -y --cleanup-tag 2>/dev/null || true
          gh release create voice-test out/*.mp3 out/*.txt --title "Voice test" --notes "Same lines in each voice" --prerelease
