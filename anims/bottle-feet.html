<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#16233a}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Fizzy bottle base. Clouds-Short style: dark navy, one object, one orange number.
// params.mode:
//  "push": a sealed fizzy bottle seen from the side (dashed outline), bubbles inside; orange
//          arrows push outward on every wall, growing as the counter "PUSH (PSI)" climbs
//          0 -> params.psi (default 35). params.label pops at the end (default "LIKE A|CAR TYRE", | = line break).
//  "feet": side profile of the bottle's base on a table line. A flat base morphs into a curvy
//          base with feet; arrows bend along the curves; the feet touch the table and glow.
//          Then a bottom view: five lobes pop in one by one, counter "FEET" 0 -> 5.
//          params.label pops at the end (default "CURVES TAKE THE PUSH").
// Keeps the top fifth (0-384) and the caption band (1344-1632) empty.
const c=document.getElementById('c'),x=c.getContext('2d'),W=1080,H=1920;
const NAVY='#16233a',YEL='#ffd23f',ORA='#ff9f1c',WHITE='#f4f1e8',TEAL='#3fc1c9',GREY='#5b6b86';
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), prog=(t,a,b)=>clamp((t-a)/(b-a));
const ease=t=>1-Math.pow(1-clamp(t),3), back=t=>{t=clamp(t);const s=1.7;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
const mix=(a,b,k)=>a+(b-a)*k;
function txt(s,px,py,size,col){x.font=`700 ${size}px Anton, Impact, sans-serif`;x.textAlign='center';x.textBaseline='middle';
  x.lineWidth=size*0.14;x.lineJoin='round';x.strokeStyle='rgba(0,0,0,.55)';x.strokeText(s,px,py);x.fillStyle=col;x.fillText(s,px,py)}
function pop(s,px,py,str,size,col){if(s<=0)return;x.save();x.translate(px,py);x.scale(s,s);txt(str,0,0,size,col);x.restore()}
function bg(){x.fillStyle=NAVY;x.fillRect(0,0,W,H)}
function arrow(x0,y0,ang,len,col,w){if(len<4)return;const x1=x0+Math.cos(ang)*len,y1=y0+Math.sin(ang)*len;
  x.save();x.strokeStyle=col;x.fillStyle=col;x.lineWidth=w;x.lineCap='round';
  x.beginPath();x.moveTo(x0,y0);x.lineTo(x1,y1);x.stroke();
  x.translate(x1,y1);x.rotate(ang);x.beginPath();x.moveTo(8,0);x.lineTo(-w*2.2,-w*1.8);x.lineTo(-w*2.2,w*1.8);x.closePath();x.fill();x.restore()}

// ---------- mode "push" ----------
const BX=430, BW=150, BT=470, BB=1250;   // bottle centre x, half width, top, bottom
function bottlePath(){x.beginPath();
  x.moveTo(BX-40,BT);x.lineTo(BX+40,BT);x.lineTo(BX+40,BT+60);
  x.bezierCurveTo(BX+BW,BT+150,BX+BW,BT+220,BX+BW,BT+260);
  x.lineTo(BX+BW,BB-60);x.quadraticCurveTo(BX+BW,BB,BX+BW-60,BB);
  x.lineTo(BX-BW+60,BB);x.quadraticCurveTo(BX-BW,BB,BX-BW,BB-60);
  x.lineTo(BX-BW,BT+260);x.bezierCurveTo(BX-BW,BT+220,BX-BW,BT+150,BX-40,BT+60);x.closePath()}
const BUB=[...Array(26)].map((_,i)=>[BX-BW+30+((i*73)%(2*BW-60)), (i*137)%600, 6+(i%4)*3]);
function drawPush(t,p,P){bg();
  const intro=back(prog(p,0,0.12));
  x.save();x.translate(BX,(BT+BB)/2);x.scale(0.75+0.25*intro,0.75+0.25*intro);x.translate(-BX,-(BT+BB)/2);
  // liquid + bubbles
  x.save();bottlePath();x.clip();x.fillStyle='rgba(63,193,201,.18)';x.fillRect(0,BT+330,W,BB);
  BUB.forEach(([bx,o,r])=>{const by=BB-40-((o+t*140)%650);x.strokeStyle='rgba(244,241,232,.7)';x.lineWidth=3;x.beginPath();x.arc(bx,by,r,0,7);x.stroke()});
  x.restore();
  // dashed outline
  x.setLineDash([26,16]);x.strokeStyle=WHITE;x.lineWidth=8;bottlePath();x.stroke();x.setLineDash([]);
  // cap
  x.fillStyle=GREY;x.beginPath();x.roundRect(BX-52,BT-60,104,70,12);x.fill();
  // arrows pushing out on every wall
  const k=ease(prog(p,0.18,0.8)), pulse=1+0.12*Math.sin(t*8);
  const L=(30+70*k)*pulse;
  if(p>0.16){
    for(let i=0;i<5;i++){const yy=BT+330+i*95;arrow(BX+BW+12,yy,0,L,ORA,10);arrow(BX-BW-12,yy,Math.PI,L,ORA,10)}
    for(let i=-1;i<=1;i++)arrow(BX+i*80,BB+12,Math.PI/2,L*0.8,ORA,10);
    arrow(BX+95,BT+150,-0.6,L*0.7,ORA,9);arrow(BX-95,BT+150,Math.PI+0.6,L*0.7,ORA,9);
  }
  x.restore();
  const n=Math.round((P.psi||35)*k);
  txt('PUSH (PSI)',845,640,50,WHITE);pop(1+0.15*Math.sin(t*8)*(k<1?1:0),845,770,String(n),150,ORA);
  if(p>0.85){const s2=back(prog(p,0.85,0.94)),L2=(P.label||'LIKE A|CAR TYRE').split('|');L2.forEach((w,i)=>pop(s2,845,930+i*90,w,76,YEL))}
}

// ---------- mode "feet" ----------
const TY=1010;  // table line in side view
function baseShape(k){ // k: 0 flat base, 1 curvy base with feet. returns points along the bottom from left to right
  const pts=[];const L=260,R=820,N=80;
  for(let i=0;i<=N;i++){const u=i/N,px=mix(L,R,u);
    // feet: 3 visible lobes in side profile (outer two + middle one), valleys between them lift up
    const wave=Math.cos(u*Math.PI*4);            // +1 at u=0,.5,1 -> feet ; -1 at u=.25,.75 -> valleys
        const yFlat=TY-2;
    const yCurvy=TY-2-(1-wave)*55;
    pts.push([px,mix(yFlat,yCurvy,k)]);}
  return pts}
function drawFeet(t,p,P){bg();
  const side=p<0.56, sideA=1-ease(prog(p,0.5,0.56)), botA=ease(prog(p,0.56,0.62));
  if(side||sideA>0){x.save();x.globalAlpha=side?1:sideA;
    const intro=back(prog(p,0,0.1));
    x.save();x.translate(540,TY);x.scale(0.8+0.2*intro,0.8+0.2*intro);x.translate(-540,-TY);
    // table
    x.strokeStyle=GREY;x.lineWidth=10;x.beginPath();x.moveTo(110,TY+8);x.lineTo(970,TY+8);x.stroke();
    // bottle walls + base
    const k=ease(prog(p,0.12,0.36));const pts=baseShape(k);
    x.fillStyle='rgba(63,193,201,.18)';x.strokeStyle=WHITE;x.lineWidth=9;
    x.beginPath();x.moveTo(260,470);pts.forEach(([a,b])=>x.lineTo(a,b));x.lineTo(820,470);x.fill();
    x.beginPath();x.moveTo(260,470);pts.forEach(([a,b])=>x.lineTo(a,b));x.lineTo(820,470);x.stroke();
    // arrows pushing down on the base: straight down on flat; along the curve normals once curvy
    const pulse=1+0.12*Math.sin(t*8);
    [0.12,0.25,0.5,0.75,0.88].forEach(u=>{const i=Math.round(u*80),[a,b]=pts[i],[a2,b2]=pts[Math.min(80,i+1)],[a0,b0]=pts[Math.max(0,i-1)];
      const nx=-(b2-b0),ny=(a2-a0),nl=Math.hypot(nx,ny)||1;let ang=Math.atan2(ny/nl,nx/nl);
      ang=mix(Math.PI/2,ang,k);arrow(a-Math.cos(ang)*90,b-Math.sin(ang)*90,ang,62*pulse,ORA,9)});
    // feet glow where they touch the table
    if(k>0.9){const g=ease(prog(p,0.36,0.42));x.save();x.globalAlpha=g;x.shadowColor=ORA;x.shadowBlur=40;x.fillStyle=ORA;
      [0,0.5,1].forEach(u=>{const [a,b]=pts[Math.round(u*80)];x.beginPath();x.arc(mix(a,540,0.04),b+4,20,0,7);x.fill()});x.restore();
      txt('FEET',540,TY+110,64,ORA)}
    x.restore();
    if(p<0.14)txt('FLAT?',540,560,80,WHITE);
    else if(p>0.3)pop(back(prog(p,0.3,0.38)),540,560,'CURVES',80,YEL);
    x.restore()}
  if(botA>0){x.save();x.globalAlpha=botA;
    const cx=540,cy=830,R0=330;
    // bottom view: outer ring, then five lobes pop in one by one
    x.strokeStyle=GREY;x.lineWidth=8;x.beginPath();x.arc(cx,cy,R0,0,7);x.stroke();
    const n=Math.min(5,Math.floor(prog(p,0.6,0.84)*5+1e-6+ (p>=0.84?1:0)));
    for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5,s=i<n?back(prog(p,0.6+i*0.048,0.6+i*0.048+0.05)):0;
      if(s<=0)continue;const lx=cx+Math.cos(a)*200,ly=cy+Math.sin(a)*200;
      x.save();x.translate(lx,ly);x.rotate(a);x.scale(s,s);
      x.shadowColor=ORA;x.shadowBlur=30;x.fillStyle=ORA;x.beginPath();x.ellipse(0,0,105,72,0,0,7);x.fill();x.restore()}
    x.fillStyle='rgba(244,241,232,.85)';x.beginPath();x.arc(cx,cy,42,0,7);x.fill();
    txt('FEET',880,1180,50,WHITE);pop(1,880,1270,String(n),120,ORA);
    if(p>0.86)pop(back(prog(p,0.86,0.95)),430,1240,P.label||'CURVES TAKE THE PUSH',62,YEL);
    x.restore()}
}

window.draw=function(t,dur,P){
  P=Object.assign({mode:'push'},P||{});
  const p=t/Math.max(dur,0.1);
  x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.shadowBlur=0;x.setLineDash([]);
  if(P.mode==='feet')drawFeet(t,p,P);else drawPush(t,p,P);
};
window.draw(0,6,{});
</script></body></html>
