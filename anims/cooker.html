<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#16233a}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Why a pressure cooker whistles. Clouds-Short style: dark navy, dashed outlines,
// one big orange temperature number that moves with the words.
// params.mode:
//  "open":    an open pot on a flame; water bubbles; steam dots float up and away out of the top;
//             the number climbs to 100 and STICKS there (params.label, e.g. "STUCK AT 100").
//  "seal":    the lid goes on; steam dots can't leave, they crowd under the lid; yellow arrows press
//             down on the water (params.press, e.g. "PRESSING"); the number climbs 100 -> params.to (121).
//  "whistle": close-up of the vent on the lid with the heavy weight sitting on it; a PUSH bar fills;
//             the weight lifts, a jet of steam bursts out, "WHISTLE!" pops (params.label), the weight drops
//             back and the bar falls, then it repeats once.
// Keeps the top fifth (0-384) and the caption band (1344-1632) empty.
const c=document.getElementById('c'),x=c.getContext('2d'),W=1080,H=1920;
const NAVY='#16233a',YEL='#ffd23f',ORA='#ff9f1c',WHITE='#f4f1e8',TEAL='#3fc1c9',WATER='rgba(63,193,201,.35)',RED='#ff5a5a';
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), prog=(t,a,b)=>clamp((t-a)/(b-a));
const ease=t=>1-Math.pow(1-clamp(t),3), back=t=>{t=clamp(t);const s=1.7;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
const rnd=i=>{const s=Math.sin(i*12.9898)*43758.5453;return s-Math.floor(s)};
function txt(s,px,py,size,col){x.font=`700 ${size}px Anton, Impact, sans-serif`;x.textAlign='center';x.textBaseline='middle';
  x.lineWidth=size*0.14;x.lineJoin='round';x.strokeStyle='rgba(0,0,0,.55)';x.strokeText(s,px,py);x.fillStyle=col;x.fillText(s,px,py)}
function bg(){x.fillStyle=NAVY;x.fillRect(0,0,W,H);
  for(let i=0;i<220;i++){x.fillStyle='rgba(255,255,255,.035)';x.fillRect(rnd(i)*W,rnd(i+99)*H,3,3)}}
function dashed(path,col,glow,lw){x.save();x.setLineDash([22,16]);x.lineWidth=lw||7;x.strokeStyle=col;x.shadowColor=col;x.shadowBlur=glow||18;path();x.stroke();x.restore()}
function pop(s,px,py,str,size,col){if(s<=0)return;x.save();x.translate(px,py);x.scale(s,s);txt(str,0,0,size,col);x.restore()}
function arrowDown(ax,ay,len,col,a){x.save();x.globalAlpha=a;x.strokeStyle=col;x.fillStyle=col;x.lineWidth=12;x.lineCap='round';
  x.beginPath();x.moveTo(ax,ay);x.lineTo(ax,ay+len);x.stroke();x.beginPath();x.moveTo(ax,ay+len+30);x.lineTo(ax-24,ay+len-4);x.lineTo(ax+24,ay+len-4);x.fill();x.restore()}
function degrees(v,px,py,s,col){if(s<=0)return;pop(s,px,py,Math.round(v)+'°',170,col||ORA);pop(s,px,py+110,'CELSIUS',44,col||ORA)}
function flame(t,cx,cy){for(let i=0;i<7;i++){const fx=cx-180+i*60,h=44+12*Math.sin(t*9+i*1.7);
  x.fillStyle=i%2?ORA:YEL;x.globalAlpha=.9;x.beginPath();x.moveTo(fx-22,cy);x.quadraticCurveTo(fx,cy-h*1.4,fx+22,cy);x.fill()}x.globalAlpha=1}

// pot geometry
const PL=250,PR=830,PT=740,PB=1130,WL=950; // pot left/right/top/bottom, water surface y
function pot(t,lid){
  // water
  x.fillStyle=WATER;x.beginPath();x.moveTo(PL,WL);for(let k=0;k<=24;k++)x.lineTo(PL+(PR-PL)*k/24,WL+Math.sin(t*5+k*0.9)*7);
  x.lineTo(PR,PB);x.lineTo(PL,PB);x.closePath();x.fill();
  // bubbles rising in the water
  for(let i=0;i<14;i++){const ph=(t*0.7+rnd(i))%1;x.strokeStyle=WHITE;x.globalAlpha=.6*(1-ph);x.lineWidth=4;
    x.beginPath();x.arc(PL+40+rnd(i+30)*(PR-PL-80),PB-20-ph*(PB-WL-30),8+rnd(i+60)*8,0,7);x.stroke()}x.globalAlpha=1;
  dashed(()=>{x.beginPath();x.moveTo(PL,PT);x.lineTo(PL,PB);x.lineTo(PR,PB);x.lineTo(PR,PT)},WHITE,10);
  // handle
  dashed(()=>{x.beginPath();x.moveTo(PR,PT+60);x.lineTo(PR+150,PT+60)},WHITE,8,8);
  if(lid>0){const ly=PT-200*(1-lid);x.save();x.globalAlpha=lid;
    x.fillStyle='rgba(244,241,232,.12)';x.beginPath();x.roundRect(PL-30,ly-34,PR-PL+60,40,14);x.fill();
    dashed(()=>{x.beginPath();x.roundRect(PL-30,ly-34,PR-PL+60,40,14)},WHITE,10,6);
    // vent stub + weight on top
    x.fillStyle=ORA;x.beginPath();x.roundRect(510,ly-110,60,76,12);x.fill();x.restore()}
  flame(t,540,PB+95);
}
function drawOpen(t,p,P){
  pot(t,0);
  const on=ease(prog(p,0.08,0.2));
  for(let i=0;i<26;i++){const ph=(t*0.45+rnd(i))%1;const sx=PL+60+rnd(i+11)*(PR-PL-120)+Math.sin(t*2+i)*30, sy=WL-30-ph*560;
    x.fillStyle=WHITE;x.globalAlpha=on*0.7*(1-ph);x.beginPath();x.arc(sx,sy,14+ph*16,0,7);x.fill()}x.globalAlpha=1;
  const temp=20+80*ease(prog(p,0.05,0.4));
  degrees(temp,540,520,back(prog(p,0.02,0.12)),temp>=99.5?YEL:ORA);
  pop(back(prog(p,0.45,0.56)),540,1300,P.label||'STUCK AT 100',74,ORA);
  if(p>0.6){const a=ease(prog(p,0.6,0.7));arrowDown(860,650,-160*a,TEAL,a);pop(back(prog(p,0.62,0.74)),900,430,P.steam||'STEAM ESCAPES',56,TEAL)}
}
function drawSeal(t,p,P){
  const lid=ease(prog(p,0.02,0.15));pot(t,lid);
  // trapped steam crowding under the lid
  const n=Math.round(10+60*ease(prog(p,0.12,0.6)));
  for(let i=0;i<n;i++){const bx=PL+30+((rnd(i)*(PR-PL-60))+Math.sin(t*3+i)*24+PR-PL)%(PR-PL-60), by=PT+20+rnd(i+40)*(WL-PT-60)+Math.cos(t*3.3+i)*14;
    x.fillStyle=WHITE;x.globalAlpha=0.75;x.beginPath();x.arc(bx,by,13,0,7);x.fill()}x.globalAlpha=1;
  const pr=ease(prog(p,0.3,0.42));
  if(pr>0){for(let k=0;k<4;k++){const ax=PL+90+k*(PR-PL-180)/3;arrowDown(ax,WL-120+Math.sin(t*6+k)*6,50,YEL,pr)}
    pop(back(prog(p,0.32,0.44)),540,1300,P.press||'PRESSING DOWN',70,YEL)}
  const to=+P.to||121, temp=100+(to-100)*ease(prog(p,0.45,0.85));
  degrees(temp,540,500,back(prog(p,0.0,0.1)),temp>=to-0.5?YEL:ORA);
}
function drawWhistle(t,p,P){
  // big close-up of the lid, vent pipe and weight
  const LY=1040, VX=540;
  x.fillStyle='rgba(244,241,232,.10)';x.beginPath();x.roundRect(120,LY,840,90,24);x.fill();
  dashed(()=>{x.beginPath();x.roundRect(120,LY,840,90,24)},WHITE,10);
  // steam crowd under the lid
  for(let i=0;i<40;i++){x.fillStyle=WHITE;x.globalAlpha=.55;x.beginPath();x.arc(150+rnd(i)*780,LY+120+rnd(i+9)*150+Math.sin(t*3+i)*12,12,0,7);x.fill()}x.globalAlpha=1;
  // vent pipe
  dashed(()=>{x.beginPath();x.moveTo(VX-26,LY);x.lineTo(VX-26,LY-150);x.moveTo(VX+26,LY);x.lineTo(VX+26,LY-150)},TEAL,12,6);
  // two cycles of build -> lift -> drop
  const cyc=[[0.12,0.42],[0.55,0.82]];let push=0,lift=0,jet=0;
  for(const [a,b] of cyc){const q=prog(p,a,b);if(p>=a&&p<=b+0.06){push=q<0.6?ease(q/0.6):1-ease((q-0.6)/0.4);
    lift=q<0.6?0:(q<0.7?ease((q-0.6)/0.1):(q<0.88?1:1-ease((q-0.88)/0.12)));jet=q>0.6&&q<0.95?1:0}}
  // weight (heavy orange cap)
  const wy=LY-150-120*lift;
  x.fillStyle=ORA;x.beginPath();x.roundRect(VX-80,wy-150,160,150,26);x.fill();
  x.fillStyle='rgba(0,0,0,.18)';x.fillRect(VX-80,wy-40,160,14);
  // steam jet out of the gap
  if(jet){for(let i=0;i<22;i++){const ph=(t*1.6+rnd(i))%1, side=i%2?1:-1;x.fillStyle=WHITE;x.globalAlpha=0.85*(1-ph);
    x.beginPath();x.arc(VX+side*(90+ph*330),wy-10-ph*160+rnd(i+5)*40,10+ph*26,0,7);x.fill()}x.globalAlpha=1;
    pop(back(prog(t%10,0,0.25)+1),540,560,P.label||'WHISTLE!',130,YEL)}
  // PUSH bar on the right
  const BX=900,BT=560,BB=980;x.strokeStyle=WHITE;x.lineWidth=6;x.strokeRect(BX-34,BT,68,BB-BT);
  x.fillStyle=push>0.95?RED:ORA;x.fillRect(BX-28,BB-(BB-BT-12)*push-6,56,(BB-BT-12)*push);
  pop(back(prog(p,0.02,0.12)),BX,BB+60,P.push||'PUSH',54,ORA);
  pop(back(prog(p,0.02,0.12)),250,820,P.weight||'WEIGHT',58,ORA);
  pop(back(prog(p,0.88,0.96)),540,1290,P.after||'DOOR SHUTS AGAIN',70,TEAL);
}

window.draw=function(t,dur,P){
  P=Object.assign({mode:'open'},P||{});
  const p=t/Math.max(dur,0.1);
  x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.shadowBlur=0;bg();
  if(P.mode==='seal')drawSeal(t,p,P);else if(P.mode==='whistle')drawWhistle(t,p,P);else drawOpen(t,p,P);
};
window.draw(0,6,{});
</script></body></html>
