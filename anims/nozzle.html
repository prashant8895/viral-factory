<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#16233a}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// How a petrol nozzle stops by itself. Clouds-Short style: dark navy, dashed outlines,
// one big orange PULL meter/number that moves with the words.
// params.mode:
//  "squeeze": a wide pipe with a narrow neck; petrol dots crawl in the wide part and race through
//             the neck (params.label, e.g. "NARROW = FAST"); a thin tube rises from the neck and a
//             yellow arrow shows the pull into it (params.pull, e.g. "PULL"), then a "?" pops.
//  "sip":     the nozzle spout pointing down into a tank (dashed). Petrol streams down the spout;
//             a thin tube runs down beside it to a small air hole near the tip. Air dots get sipped in
//             through the hole and up the tube (params.label, e.g. "SIPPING AIR"). Level stays low.
//  "click":   same scene; the petrol level rises and covers the air hole, air dots stop, the PULL
//             counter climbs 0 -> 100, the rubber disc in the handle bows up, the valve snaps shut,
//             petrol stops, "CLICK" pops (params.label).
// Keeps the top fifth (0-384) and the caption band (1344-1632) empty.
const c=document.getElementById('c'),x=c.getContext('2d'),W=1080,H=1920;
const NAVY='#16233a',YEL='#ffd23f',ORA='#ff9f1c',WHITE='#f4f1e8',TEAL='#3fc1c9',FUEL='rgba(255,190,70,.55)',FUELD='#ffbe46',GRN='#5ad17a',RED='#ff5a5a';
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), prog=(t,a,b)=>clamp((t-a)/(b-a));
const ease=t=>1-Math.pow(1-clamp(t),3), back=t=>{t=clamp(t);const s=1.7;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
const rnd=i=>{const s=Math.sin(i*12.9898)*43758.5453;return s-Math.floor(s)};
function txt(s,px,py,size,col){x.font=`700 ${size}px Anton, Impact, sans-serif`;x.textAlign='center';x.textBaseline='middle';
  x.lineWidth=size*0.14;x.lineJoin='round';x.strokeStyle='rgba(0,0,0,.55)';x.strokeText(s,px,py);x.fillStyle=col;x.fillText(s,px,py)}
function bg(){x.fillStyle=NAVY;x.fillRect(0,0,W,H);
  for(let i=0;i<220;i++){x.fillStyle='rgba(255,255,255,.035)';x.fillRect(rnd(i)*W,rnd(i+99)*H,3,3)}}
function dashed(path,col,glow,lw){x.save();x.setLineDash([22,16]);x.lineWidth=lw||7;x.strokeStyle=col;x.shadowColor=col;x.shadowBlur=glow||18;path();x.stroke();x.restore()}
function pop(s,px,py,str,size,col){if(s<=0)return;x.save();x.translate(px,py);x.scale(s,s);txt(str,0,0,size,col);x.restore()}
function arrowDown(ax,ay,len,col,a){x.save();x.globalAlpha=a;x.strokeStyle=col;x.fillStyle=col;x.lineWidth=12;x.lineCap='round';
  x.beginPath();x.moveTo(ax,ay);x.lineTo(ax,ay+len);x.stroke();x.beginPath();x.moveTo(ax,ay+len+30);x.lineTo(ax-24,ay+len-4);x.lineTo(ax+24,ay+len-4);x.fill();x.restore()}

// ---------- squeeze: pipe with a narrow neck ----------
const PL=90,PR=990,PC=900; // pipe left/right, centre line y
function halfW(px){const d=(px-540)/170;return 110-72*Math.exp(-d*d)} // 110 wide, 38 at the neck
let TABLE=null;
function table(){if(TABLE)return TABLE;const n=300,cum=[0];let s=0;
  for(let i=1;i<=n;i++){s+=halfW(PL+(PR-PL)*i/n);cum.push(s)}return TABLE=cum.map(v=>v/s)}
function xAt(u){const cum=table(),n=cum.length-1;let lo=0,hi=n;while(hi-lo>1){const m=(lo+hi)>>1;if(cum[m]<u)lo=m;else hi=m}
  return PL+(PR-PL)*(lo+(u-cum[lo])/(cum[hi]-cum[lo]||1))/n}
function drawSqueeze(t,p,P){
  // walls
  const top=[],bot=[];for(let k=0;k<=60;k++){const px=PL+(PR-PL)*k/60;top.push([px,PC-halfW(px)]);bot.push([px,PC+halfW(px)])}
  const tubeIn=ease(prog(p,0.45,0.58));
  dashed(()=>{x.beginPath();top.forEach(([a,b],i)=>{if(i===0)x.moveTo(a,b);else if(Math.abs(a-540)<16&&tubeIn>0){x.moveTo(a,b)}else x.lineTo(a,b)});
    x.moveTo(...bot[0]);bot.forEach(([a,b])=>x.lineTo(a,b))},WHITE,10);
  // petrol dots: same amount per second everywhere, so they race through the neck
  const flow=ease(prog(p,0.05,0.15));
  for(let i=0;i<150;i++){const u=((t*0.16*flow+rnd(i))%1+1)%1, px=xAt(u), hw=halfW(px)-14;
    x.fillStyle=FUELD;x.globalAlpha=0.85*flow;x.beginPath();x.arc(px,PC+(rnd(i+500)-0.5)*2*hw,9,0,7);x.fill()}
  x.globalAlpha=1;
  // thin tube rising from the neck + pull arrow into it
  if(tubeIn>0){const ty=PC-halfW(540), topY=ty-330*tubeIn;
    dashed(()=>{x.beginPath();x.moveTo(524,ty);x.lineTo(524,topY);x.moveTo(556,ty);x.lineTo(556,topY)},TEAL,12,6);
    const a=ease(prog(p,0.58,0.7));if(a>0){for(let i=0;i<6;i++){const ph=(t*0.9+i/6)%1;x.fillStyle=WHITE;x.globalAlpha=a*0.8;
      x.beginPath();x.arc(540,topY+ph*(ty-topY),8,0,7);x.fill()}x.globalAlpha=1;arrowDown(650,topY+30,150*a,YEL,a)}
    pop(back(prog(p,0.6,0.72)),770,topY+110,P.pull||'PULL',84,YEL)}
  pop(back(prog(p,0,0.1)),540,470,P.title||'THE NARROW BIT',86,WHITE);
  pop(back(prog(p,0.22,0.34)),540,1180,P.label||'NARROW = FAST',78,ORA);
  pop(back(prog(p,0.85,0.95)),930,600,'?',170,WHITE);
}

// ---------- sip / click: spout down into a tank ----------
const SX=470, SW=90, ST=560, SB=1080, HX=SX+SW+44, HOLEY=1040; // spout x,width,top,bottom; sensing tube x; air hole y
function scene(t,level,flowOn,airOn,shut,disc){
  // tank
  const TL=170,TR=910,TT=900,TB=1320;
  const wy=TB-(TB-TT)*level;
  x.fillStyle=FUEL;x.beginPath();x.moveTo(TL,wy);for(let k=0;k<=24;k++)x.lineTo(TL+(TR-TL)*k/24,wy+Math.sin(t*4+k*0.8)*6);
  x.lineTo(TR,TB);x.lineTo(TL,TB);x.closePath();x.fill();
  dashed(()=>{x.beginPath();x.moveTo(TL,TT-10);x.lineTo(TL,TB);x.lineTo(TR,TB);x.lineTo(TR,TT-10)},WHITE,10);
  // handle block with the rubber disc
  x.fillStyle='rgba(244,241,232,.12)';x.beginPath();x.roundRect(SX-130,420,SW+330,150,30);x.fill();
  dashed(()=>{x.beginPath();x.roundRect(SX-130,420,SW+330,150,30)},WHITE,8,5);
  // disc (diaphragm) above the sensing tube, bows up with suction
  x.strokeStyle=TEAL;x.lineWidth=12;x.lineCap='round';x.beginPath();x.moveTo(HX-70,470);x.quadraticCurveTo(HX,470-70*disc,HX+70,470);x.stroke();
  // valve gate in the spout (orange bar): open = tucked left, shut = across the spout
  const gx=SX-6-(1-shut)*(SW+30);x.fillStyle=ORA;x.beginPath();x.roundRect(gx,600,SW+12,26,8);x.fill();
  // spout walls
  dashed(()=>{x.beginPath();x.moveTo(SX,ST);x.lineTo(SX,SB);x.moveTo(SX+SW,ST);x.lineTo(SX+SW,HOLEY-26);x.moveTo(SX+SW,HOLEY+26);x.lineTo(SX+SW,SB)},WHITE,10);
  // sensing tube: thin, runs from the handle down to the air hole
  dashed(()=>{x.beginPath();x.moveTo(HX-14,500);x.lineTo(HX-14,HOLEY-20);x.lineTo(SX+SW,HOLEY-20);x.moveTo(HX+14,500);x.lineTo(HX+14,HOLEY+20);x.lineTo(SX+SW,HOLEY+20)},TEAL,10,5);
  // petrol streaming down the spout (stops below the gate when shut)
  if(flowOn>0){for(let i=0;i<40;i++){const ph=(t*1.3+rnd(i))%1, py=ST+ph*(SB-ST+120);
      if(shut>0.5&&py>626&&py<SB)continue;x.fillStyle=FUELD;x.globalAlpha=flowOn*0.9;
      x.beginPath();x.arc(SX+18+rnd(i+70)*(SW-36),py,9,0,7);x.fill()}x.globalAlpha=1}
  // air sipped in through the hole and up the tube
  if(airOn>0){for(let i=0;i<9;i++){const ph=(t*0.8+i/9)%1;let ax,ay;
      if(ph<0.2){ax=SX+SW+60-ph/0.2*60;ax=SX+SW+(ph/0.2)*(HX-SX-SW);ay=HOLEY}else{ax=HX;ay=HOLEY-(ph-0.2)/0.8*(HOLEY-520)}
      x.fillStyle=WHITE;x.globalAlpha=airOn*0.9;x.beginPath();x.arc(ax,ay,10,0,7);x.fill()}x.globalAlpha=1}
  return {wy};
}
function holeRing(a,col){if(a<=0)return;x.save();x.globalAlpha=a;x.strokeStyle=col;x.lineWidth=8;x.beginPath();x.arc(SX+SW+4,HOLEY,46,0,7);x.stroke();x.restore()}
function drawSip(t,p,P){
  scene(t,0.25,ease(prog(p,0,0.1)),ease(prog(p,0.3,0.42)),0,0.12);
  holeRing(ease(prog(p,0.18,0.28))*(0.6+0.4*Math.sin(t*5)),YEL);
  pop(back(prog(p,0.18,0.3)),860,HOLEY-120,P.hole||'AIR HOLE',62,YEL);
  pop(back(prog(p,0.42,0.54)),900,760,P.tube||'TUBE',58,TEAL);
  pop(back(prog(p,0.55,0.68)),540,1285,P.label||'SIPPING AIR',74,ORA);
}
function drawClick(t,p,P){
  const rise=ease(prog(p,0.05,0.35)), level=0.25+0.42*rise; // covers HOLEY at ~0.65
  const covered=prog(p,0.3,0.36), pull=ease(prog(p,0.36,0.62)), shut=ease(prog(p,0.62,0.68));
  scene(t,level,1-shut,1-covered,shut,0.12+0.88*pull);
  holeRing((1-covered)*0.8,YEL);holeRing(covered*(1-shut*0.5),RED);
  // PULL counter
  const s=back(prog(p,0.32,0.42));pop(s,820,700,Math.round(pull*100)+'',150,ORA);pop(s,820,800,P.pull||'PULL',56,ORA);
  pop(back(prog(p,0.66,0.76)),300,760,P.label||'CLICK!',120,YEL);
  pop(back(prog(p,0.0,0.1)),540,1285,P.title||'PETROL RISING',70,WHITE);
}

window.draw=function(t,dur,P){
  P=Object.assign({mode:'sip'},P||{});
  const p=t/Math.max(dur,0.1);
  x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.shadowBlur=0;bg();
  if(P.mode==='squeeze')drawSqueeze(t,p,P);else if(P.mode==='click')drawClick(t,p,P);else drawSip(t,p,P);
};
window.draw(0,6,{});
</script></body></html>
