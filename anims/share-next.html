<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#101a3a}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Friendly ending: a phone, a "send" arrow flies to a friend's chat, then a comment bubble types the word.
// params: {word: "NEXT", friend: "Rahul", thumb: "escalator"|"microwave"|"fireworks"|"yawn"|"tyre"}. Keeps the top fifth and the lower third calm.
const c=document.getElementById('c'),x=c.getContext('2d'),W=1080,H=1920;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), prog=(t,a,b)=>clamp((t-a)/(b-a));
const ease=t=>1-Math.pow(1-clamp(t),3);
const back=t=>{t=clamp(t);const s=1.7;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
function rr(px,py,w,h,r,f){x.beginPath();x.roundRect(px,py,w,h,r);x.fillStyle=f;x.fill()}
function face(cx,cy,r,col,happy){x.fillStyle=col;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();
  x.fillStyle='#1b1b2a';x.beginPath();x.arc(cx-r*.35,cy-r*.15,r*.1,0,7);x.arc(cx+r*.35,cy-r*.15,r*.1,0,7);x.fill();
  x.strokeStyle='#1b1b2a';x.lineWidth=r*.09;x.lineCap='round';x.beginPath();
  if(happy)x.arc(cx,cy+r*.1,r*.4,0.15*Math.PI,0.85*Math.PI);else{x.moveTo(cx-r*.3,cy+r*.35);x.lineTo(cx+r*.3,cy+r*.35)}x.stroke()}
function heart(cx,cy,r){x.fillStyle='#ff4757';x.beginPath();x.moveTo(cx,cy+r*1.2);
  x.bezierCurveTo(cx-r*2,cy-r*.2,cx-r*.9,cy-r*1.6,cx,cy-r*.5);x.bezierCurveTo(cx+r*.9,cy-r*1.6,cx+r*2,cy-r*.2,cx,cy+r*1.2);x.fill()}
window.draw=function(t,dur,P){
  P=Object.assign({word:'NEXT',friend:'Rahul'},P||{});
  const p=t/Math.max(dur,0.1);
  x.setTransform(1,0,0,1,0,0);
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#101a3a');g.addColorStop(1,'#1d1050');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  // soft floating dots
  for(let i=0;i<30;i++){const s=Math.sin(i*91.7)*43758.5,r=s-Math.floor(s);
    x.fillStyle='rgba(255,255,255,.08)';x.beginPath();x.arc(r*W,(((r*5471)%1)*H+t*20*(1+r))%H,4+6*r,0,7);x.fill()}
  // the phone slides up
  const ph=ease(prog(p,0,0.15)), py=400+300*(1-ph), px=150, pw=400, phh=640;
  x.globalAlpha=ph;
  rr(px-14,py-14,pw+28,phh+28,64,'#0a0a12');rr(px,py,pw,phh,52,'#f4f6fb');
  rr(px+pw/2-60,py+18,120,22,11,'#0a0a12');
  // video thumbnail on the phone (an escalator brush, drawn simply)
  rr(px+30,py+70,pw-60,360,28,'#26314f');
  if(P.thumb==='microwave'){ // a microwave with its mesh door
    rr(px+55,py+150,pw-110,220,18,'#d7dbe4');rr(px+75,py+170,220,180,10,'#14161f');
    x.fillStyle='#3a3f52';for(let gy=py+180;gy<py+345;gy+=12)for(let gx=px+85;gx<px+290;gx+=12){x.beginPath();x.arc(gx,gy,3,0,7);x.fill()}
    rr(px+305,py+180,30,160,6,'#8d95ab');x.fillStyle='#2ed573';x.fillRect(px+310,py+190,20,14);
  }else if(P.thumb==='yawn'){ // a round face mid-yawn
    rr(px+30,py+70,pw-60,360,28,'#2b2350');
    const fx=px+pw/2,fy=py+250;x.fillStyle='#ffc98a';x.beginPath();x.arc(fx,fy,120,0,7);x.fill();
    x.strokeStyle='#2a1a10';x.lineWidth=7;x.lineCap='round';
    x.beginPath();x.moveTo(fx-70,fy-40);x.quadraticCurveTo(fx-45,fy-25,fx-20,fy-40);x.moveTo(fx+20,fy-40);x.quadraticCurveTo(fx+45,fy-25,fx+70,fy-40);x.stroke();
    x.fillStyle='#5a1020';x.beginPath();x.ellipse(fx,fy+45,42,58,0,0,7);x.fill();
    x.fillStyle='#ff6b81';x.beginPath();x.ellipse(fx,fy+80,26,16,0,0,7);x.fill();
  }else if(P.thumb==='tyre'){ // a black tyre on a grey road
    rr(px+30,py+70,pw-60,360,28,'#2c3448');x.fillStyle='#55596a';x.fillRect(px+30,py+360,pw-60,70);
    const tx=px+pw/2,ty=py+235;x.fillStyle='#16161c';x.beginPath();x.arc(tx,ty,125,0,7);x.fill();
    x.fillStyle='#0a0a0e';for(let k=0;k<20;k++){const a=k/20*6.283;x.beginPath();x.arc(tx+Math.cos(a)*118,ty+Math.sin(a)*118,10,0,7);x.fill()}
    x.fillStyle='#b8bfd0';x.beginPath();x.arc(tx,ty,68,0,7);x.fill();x.fillStyle='#e9ecf5';x.beginPath();x.arc(tx,ty,18,0,7);x.fill();
  }else if(P.thumb==='fireworks'){ // night sky with a red, a green and a blue burst
    rr(px+30,py+70,pw-60,360,28,'#0b1026');
    [[px+130,py+180,'#ff3b4e'],[px+270,py+230,'#2ee86a'],[px+180,py+340,'#3a8bff']].forEach(([bx,by,bc])=>{x.strokeStyle=bc;x.lineWidth=6;x.lineCap='round';
      for(let k=0;k<12;k++){const a=k/12*6.283;x.beginPath();x.moveTo(bx+Math.cos(a)*14,by+Math.sin(a)*14);x.lineTo(bx+Math.cos(a)*62,by+Math.sin(a)*62);x.stroke()}});
  }else{
  x.fillStyle='#8d95ab';x.fillRect(px+30,py+300,pw-60,130);
  x.strokeStyle='#5c6378';x.lineWidth=8;for(let k=0;k<6;k++){x.beginPath();x.moveTo(px+40,py+318+k*20);x.lineTo(px+pw-40,py+318+k*20);x.stroke()}
  x.strokeStyle='#15151a';x.lineWidth=7;for(let k=0;k<30;k++){x.beginPath();x.moveTo(px+50+k*11,py+300);x.lineTo(px+44+k*11,py+262);x.stroke()}
  }
  // share button on the phone, pulses before it is "tapped"
  const tap=prog(p,0.18,0.3), pulse=1+0.08*Math.sin(t*10)*(1-tap);
  x.save();x.translate(px+pw/2,py+520);x.scale(pulse*(1-0.15*Math.sin(Math.PI*tap)),pulse*(1-0.15*Math.sin(Math.PI*tap)));
  rr(-150,-55,300,110,55,'#2ed573');
  x.fillStyle='#fff';x.beginPath();x.moveTo(-70,-28);x.lineTo(-10,0);x.lineTo(-70,28);x.lineTo(-58,0);x.closePath();x.fill();
  x.font='700 46px Anton, Impact, sans-serif';x.textAlign='left';x.textBaseline='middle';x.fillText('SEND',0,2);
  x.restore();
  x.globalAlpha=1;
  // a paper plane flies from the phone to the friend
  const fl=prog(p,0.3,0.5);
  const fx=px+pw/2+(820-(px+pw/2))*ease(fl), fy=py+520-260*Math.sin(Math.PI*fl)+(620-(py+520))*ease(fl);
  if(fl>0&&fl<1){x.save();x.translate(fx,fy);x.rotate(-0.4+0.8*fl);x.fillStyle='#ffd23f';
    x.beginPath();x.moveTo(40,0);x.lineTo(-30,-26);x.lineTo(-14,0);x.lineTo(-30,26);x.closePath();x.fill();x.restore()}
  // the friend: appears, reads, laughs
  const fr=back(prog(p,0.22,0.34)), got=prog(p,0.5,0.56);
  x.save();x.translate(820,640);x.scale(fr,fr);
  face(0,0,110,'#ffcf9f',got>0);
  x.font='700 44px Anton, Impact, sans-serif';x.textAlign='center';x.fillStyle='#fff';x.fillText(P.friend,0,150);
  x.restore();
  if(got>0){x.font='900 64px Anton, Impact, sans-serif';x.textAlign='center';x.fillStyle='#ffd23f';
    x.globalAlpha=1-prog(p,0.7,0.8);x.fillText('HAHA',820+40*got,480-50*got);x.globalAlpha=1}
  // comment bubble typing the word
  const cb=back(prog(p,0.58,0.68)), typed=Math.floor(P.word.length*prog(p,0.66,0.82));
  if(cb>0){x.save();x.translate(540,1180);x.scale(cb,cb);
    rr(-330,-80,660,160,46,'#ffffff');
    x.fillStyle='#ffffff';x.beginPath();x.moveTo(-200,80);x.lineTo(-250,140);x.lineTo(-150,85);x.fill();
    face(-250,0,48,'#9ad0ff',true);
    x.font='900 110px Anton, Impact, sans-serif';x.textAlign='left';x.textBaseline='middle';x.fillStyle='#ff4757';
    const shown=P.word.slice(0,typed); x.fillText(shown,-170,6);
    if(Math.floor(t*3)%2===0&&typed<P.word.length){const w=x.measureText(shown).width;x.fillRect(-165+w,-45,8,95)}
    x.restore()}
  // little hearts once the word is typed
  const hp=prog(p,0.82,1); if(hp>0){for(let k=0;k<5;k++){const a=prog(hp,k*0.1,k*0.1+0.6);if(a<=0)continue;
    x.globalAlpha=1-a;heart(360+k*90,1080-220*a,26);}x.globalAlpha=1}
};
window.draw(0,6,{});
</script></body></html>
