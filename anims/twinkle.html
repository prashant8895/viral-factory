<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#070b1f}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Why stars twinkle (scintillation). params.mode:
//  "ray":   one star, its light zig-zags through moving warm/cold air pockets, the star flickers.
//           params: warm, cold, air
//  "disk":  left a point-like STAR (one ray, flickers), right a PLANET disk (many rays, wobbles
//           average out, steady). params: star, planet, flicker, steady
//  "space": above the air a satellite sees a steady star; below the air a person sees it twinkle.
//           params: space, air, steady, flicker
// Keeps the top fifth (0-384) and the caption band (70%-85%, 1344-1632) empty.
const c=document.getElementById('c'),x=c.getContext('2d'),W=1080,H=1920;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), prog=(t,a,b)=>clamp((t-a)/(b-a));
const ease=t=>1-Math.pow(1-clamp(t),3), lerp=(a,b,t)=>a+(b-a)*t;
function rnd(i){const s=Math.sin(i*127.1)*43758.5453;return s-Math.floor(s)}
function noise(t,k){return Math.sin(t*7.3+k*1.7)*.5+Math.sin(t*13.1+k*3.1)*.3+Math.sin(t*23.7+k*5.3)*.2}
function label(txt,cx,cy,col,size){x.font=`700 ${size||54}px Anton, Impact, sans-serif`;x.textAlign='center';x.textBaseline='middle';
  const w=x.measureText(txt).width+48;x.fillStyle='rgba(8,12,30,.8)';x.beginPath();x.roundRect(cx-w/2,cy-42,w,84,42);x.fill();
  x.fillStyle=col;x.fillText(txt,cx,cy+2)}
function sky(t,top,bot){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#04071a');g.addColorStop(.6,'#0d1640');g.addColorStop(1,'#1b1f3a');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  for(let i=0;i<70;i++){const sx=rnd(i)*W, sy=400+rnd(i+50)*(top-420); if(sy>top-20)continue;
    x.fillStyle=`rgba(255,255,255,${.25+.35*rnd(i+9)})`;x.beginPath();x.arc(sx,sy,1.5+2*rnd(i+3),0,7);x.fill()}}
function ground(y){x.fillStyle='#10142a';x.fillRect(0,y,W,H-y);
  x.fillStyle='#181d38';for(let i=0;i<12;i++){const h=40+rnd(i+70)*90;x.fillRect(i*95-10,y-h,80,h)}}
function air(t,top,bot,strength){ // drifting warm / cold pockets
  for(let i=0;i<14;i++){const warm=i%2===0, r=90+rnd(i+20)*80;
    const px=((rnd(i+30)*W+t*(40+rnd(i+40)*60)*(i%3?1:-1))%(W+300)+W+300)%(W+300)-150;
    const py=lerp(top+60,bot-60,rnd(i+60));
    const g=x.createRadialGradient(px,py,0,px,py,r);const col=warm?'255,140,60':'80,160,255';
    g.addColorStop(0,`rgba(${col},${.32*strength})`);g.addColorStop(1,`rgba(${col},0)`);
    x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill()}}
function star(px,py,b,t,k){ // b = brightness 0..1.3
  const r=18*b, g=x.createRadialGradient(px,py,0,px,py,90*b);g.addColorStop(0,`rgba(255,255,255,${clamp(b)})`);
  g.addColorStop(.25,`rgba(200,225,255,${.6*clamp(b)})`);g.addColorStop(1,'rgba(200,225,255,0)');
  x.fillStyle=g;x.beginPath();x.arc(px,py,90*b,0,7);x.fill();
  x.strokeStyle=`rgba(255,255,255,${.8*clamp(b)})`;x.lineWidth=4;
  [[0,1],[1,0]].forEach(([a,bb])=>{x.beginPath();x.moveTo(px-60*b*a,py-60*b*bb);x.lineTo(px+60*b*a,py+60*b*bb);x.stroke()});
  x.fillStyle='#fff';x.beginPath();x.arc(px,py,Math.max(4,r*.5),0,7);x.fill()}
function ray(x0,y0,x1,y1,top,bot,t,k,wob,col,al){ // light path, bent inside the air band
  x.strokeStyle=col;x.globalAlpha=al;x.lineWidth=7;x.lineCap='round';x.lineJoin='round';x.shadowColor=col;x.shadowBlur=18;
  x.beginPath();x.moveTo(x0,y0);const steps=7;
  let ex=0;
  for(let s=0;s<=steps;s++){const f=s/steps, yy=lerp(top,bot,f);
    const base=lerp(x0,x1,(yy-y0)/(y1-y0));
    const off=wob*noise(t,k*10+s)*(s>0&&s<steps?1:(s===steps?1:0));
    if(s===0)x.lineTo(base,top);else x.lineTo(base+off,yy);ex=off}
  x.lineTo(x1+ex*.6,y1);x.stroke();x.shadowBlur=0;x.globalAlpha=1;return ex}
function eye(px,py,a){x.save();x.globalAlpha=a;x.translate(px,py);x.fillStyle='#fff';
  x.beginPath();x.ellipse(0,0,70,38,0,0,7);x.fill();x.fillStyle='#3a6fd8';x.beginPath();x.arc(0,0,26,0,7);x.fill();
  x.fillStyle='#000';x.beginPath();x.arc(0,0,12,0,7);x.fill();x.restore()}
function sat(px,py){x.save();x.translate(px,py);x.fillStyle='#c8ccd8';x.fillRect(-30,-24,60,48);
  x.fillStyle='#2f6bd6';x.fillRect(-130,-16,88,32);x.fillRect(42,-16,88,32);x.strokeStyle='#c8ccd8';x.lineWidth=5;
  x.beginPath();x.moveTo(-42,0);x.lineTo(-30,0);x.moveTo(30,0);x.lineTo(42,0);x.stroke();
  x.fillStyle='#111';x.beginPath();x.arc(0,-24,14,Math.PI,0);x.fill();x.restore()}
function tick(px,py,s,col){x.strokeStyle=col;x.lineWidth=14;x.lineCap='round';x.beginPath();x.moveTo(px-30*s,py);x.lineTo(px-8*s,py+24*s);x.lineTo(px+34*s,py-26*s);x.stroke()}
window.draw=function(t,dur,P){
  P=Object.assign({mode:'ray',warm:'WARM',cold:'COLD',air:'AIR',star:'STAR',planet:'PLANET',flicker:'FLICKER',steady:'STEADY',space:'SPACE'},P||{});
  const p=t/Math.max(dur,0.1), m=P.mode, a0=ease(prog(p,0,.12));
  x.setTransform(1,0,0,1,0,0);
  if(m==='ray'){
    const TOP=640,BOT=1140; sky(t,TOP,BOT);
    const s=ease(prog(p,.1,.35)); air(t,TOP,BOT,1);
    ground(1220);
    const wob=lerp(0,60,s);
    const ex=ray(540,470,540,1160,TOP,BOT,t,1,wob,'#fff3b0',a0);
    const fl=1+.35*s*noise(t*1.6,2);
    star(540+ex*.15,470,a0*fl,t,1);eye(540+ex*.6,1190,a0);
    const l=ease(prog(p,.2,.35));x.globalAlpha=l;label(P.warm,230,760,'#ffb15c',54);label(P.cold,850,1020,'#9fd4ff',54);x.globalAlpha=1;
  }else if(m==='disk'){
    const TOP=680,BOT=1120; sky(t,TOP,BOT);air(t,TOP,BOT,.9);ground(1210);
    const s=ease(prog(p,.08,.3)), wob=lerp(10,60,s);
    x.fillStyle='rgba(255,255,255,.12)';x.fillRect(538,420,4,800);
    // left: star, one ray
    const ex=ray(270,470,270,1160,TOP,BOT,t,3,wob,'#fff3b0',a0);
    star(270+ex*.15,470,a0*(1+.45*s*noise(t*1.6,4)),t,2);
    // right: planet disk, many rays
    const pr=ease(prog(p,.25,.45));
    let sum=0;const N=7;
    for(let i=0;i<N;i++){const dx=(i-(N-1)/2)*13;sum+=ray(810+dx,470,810+dx*.4,1160,TOP,BOT,t,20+i*7,wob,'#ffcf8a',a0*pr*.55)}
    x.globalAlpha=a0*pr;const pg=x.createRadialGradient(810,470,0,810,470,110);pg.addColorStop(0,'rgba(255,214,150,.55)');pg.addColorStop(1,'rgba(255,214,150,0)');
    x.fillStyle=pg;x.beginPath();x.arc(810,470,110,0,7);x.fill();
    const dg=x.createLinearGradient(770,430,850,510);dg.addColorStop(0,'#ffe2b0');dg.addColorStop(1,'#d9905a');x.fillStyle=dg;x.beginPath();x.arc(810,470,46,0,7);x.fill();
    x.strokeStyle='rgba(150,80,40,.5)';x.lineWidth=6;[-14,4,18].forEach(o=>{x.beginPath();x.moveTo(770,470+o);x.lineTo(850,470+o);x.stroke()});x.globalAlpha=1;
    eye(270+ex*.6,1190,a0);eye(810+sum/N*.6*.3,1190,a0*pr);
    const l=ease(prog(p,.1,.25));x.globalAlpha=l;label(P.star,270,600,'#ffffff',58);x.globalAlpha=pr;label(P.planet,810,600,'#ffcf8a',58);
    const l2=ease(prog(p,.5,.65));x.globalAlpha=l2;label(P.flicker,270,1300,'#ff6b6b',52);label(P.steady,810,1300,'#2ed573',52);x.globalAlpha=1;
  }else{ // space
    const TOP=880,BOT=1140; sky(t,TOP,BOT);
    // atmosphere band
    const ag=x.createLinearGradient(0,TOP-40,0,BOT);ag.addColorStop(0,'rgba(90,150,255,0)');ag.addColorStop(.3,'rgba(90,150,255,.22)');ag.addColorStop(1,'rgba(90,150,255,.35)');
    x.fillStyle=ag;x.fillRect(0,TOP-40,W,BOT-TOP+80);air(t,TOP,BOT,.9);ground(1220);
    const s=ease(prog(p,.1,.3));
    // to the satellite: straight, above the air
    x.strokeStyle='#fff3b0';x.lineWidth=7;x.shadowColor='#fff3b0';x.shadowBlur=18;x.globalAlpha=a0;
    x.beginPath();x.moveTo(540,470);x.lineTo(270,740);x.stroke();x.shadowBlur=0;x.globalAlpha=1;
    // to the person: bent inside the air
    const ex=ray(540,470,800,1160,TOP,BOT,t,9,lerp(10,60,s),'#fff3b0',a0);
    star(540,470,a0*(1+.12*s*noise(t*1.6,5)),t,3);
    x.globalAlpha=a0;sat(270,760);eye(800+ex*.6,1190,1);x.globalAlpha=1;
    const l=ease(prog(p,.15,.3));x.globalAlpha=l;label(P.space,820,690,'#c9b8ff',54);label(P.air,170,1010,'#9fd4ff',52);x.globalAlpha=1;
    const l2=ease(prog(p,.45,.6));x.globalAlpha=l2;label(P.steady,190,640,'#2ed573',50);
    label(P.flicker,800,1300,'#ff6b6b',50);x.globalAlpha=1;
  }
};
window.draw(0,6,{});
</script></body></html>
